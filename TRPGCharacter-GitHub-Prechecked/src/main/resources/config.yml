# TRPGCharacter 設定

book:
  title: "探索者シート"
  author: "TRPG System"

# 能力値がまだ設定されていないプレイヤーの初期値
default-stat-value: 0

# /roll と本からの判定結果を全体チャットに表示するか
broadcast-rolls: true

# 入力できる能力値・技能値の範囲
input:
  min: 0
  max: 999

messages:
  prefix: "&6[TRPG]&r "


# 画面右側の個別ステータス表示
sidebar:
  enabled: true
  server-name: "MCTRPG Sever"
  # 20tick = 1秒
  update-interval: 20


# Minecraft本体の体力・満腹度との同期
health-sync:
  # 能力値未設定時の即死防止用
  safe-hp: 4
  # trueで満腹度を常に最大固定
  disable-hunger: true


# HP/SAN低下時の危険演出
danger-effects:
  enabled: true

  # 20tick = 1秒
  # 40tickなら約2秒ごとに状態を確認
  check-interval: 40

  # 固定の3段階
  # 50%以下: 軽度
  # 25%以下: 中度
  # 10%以下: 重度


# 入室時の本人向け案内
join-guide:
  enabled: true


# 暗所に入った際の「目星」自動判定と暗視
dark-vision:
  enabled: true

  # この明るさ以下を暗所として扱う（Minecraftの明るさ 0～15）
  light-level-threshold: 4

  # 使用する技能ID
  skill: "spot_hidden"

  # 暗所判定の周期。20tick = 1秒
  check-interval: 10

  # 成功中に付与する暗視の残り時間。
  # 暗所にいる間は定期的に更新され、明所へ出ると数秒で自然解除。
  effect-refresh-ticks: 80


# 水中に入った際の「水泳」自動判定
auto-swim:
  enabled: true

  # 使用する技能ID
  skill: "swim"

  # 水中判定の周期。20tick = 1秒
  check-interval: 10

  # 成功中に付与するイルカの好意の残り時間。
  # 水中にいる間は更新され、水から出ると自然解除される。
  effect-refresh-ticks: 80

  # 0 = イルカの好意 I
  dolphins-grace-amplifier: 0


# 技能成長
# クリティカル/ファンブル時に自動で成長判定を行う。
# 成長判定: 1d100 > 現在技能値 で成功。
skill-growth:
  enabled: true
  trigger-critical: true
  trigger-fumble: true
  increase: "1d10"
  max-skill-value: 99


# 壁キック（登攀）
wall-kick:
  enabled: true
  skill: "climb"
  double-jump-window-ms: 450
  cooldown-ms: 900
  wall-check-distance: 0.55
  horizontal-velocity: 0.65
  vertical-velocity: 0.72
  special-multiplier: 1.15
  critical-multiplier: 1.30
  fumble-downward-velocity: 0.35
